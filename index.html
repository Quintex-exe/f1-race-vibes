<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Race Vibes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        h1 {
            font-size: 4rem;
            font-weight: bold;
            background: linear-gradient(45deg, #e10600, #ff6b00, #e10600);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 3s ease infinite;
            letter-spacing: 8px;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            color: #888;
            margin-top: 10px;
            font-size: 1.2rem;
            letter-spacing: 3px;
        }

        .track {
            position: relative;
            height: 120px;
            background: #16213e;
            border-radius: 60px;
            margin: 40px 0;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(225, 6, 0, 0.3);
        }

        .track::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 4px;
            background: repeating-linear-gradient(
                90deg,
                #fff 0px,
                #fff 30px,
                transparent 30px,
                transparent 60px
            );
            transform: translateY(-50%);
            animation: trackMove 2s linear infinite;
        }

        @keyframes trackMove {
            0% { transform: translateY(-50%) translateX(0); }
            100% { transform: translateY(-50%) translateX(-60px); }
        }

        .car {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            animation: race 8s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(225, 6, 0, 0.8));
        }

        @keyframes race {
            0%, 100% { left: -5%; }
            50% { left: 95%; }
        }

        .standings {
            display: grid;
            gap: 20px;
            margin-top: 60px;
        }

        .driver-card {
            background: rgba(22, 33, 62, 0.6);
            border-left: 5px solid;
            padding: 25px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .driver-card:hover {
            transform: translateX(10px);
            box-shadow: 0 10px 30px rgba(225, 6, 0, 0.4);
        }

        .driver-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .position {
            font-size: 2rem;
            font-weight: bold;
            width: 50px;
            text-align: center;
        }

        .driver-name {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .team {
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .points {
            font-size: 2rem;
            font-weight: bold;
            color: #e10600;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 60px;
        }

        .stat-card {
            background: rgba(22, 33, 62, 0.6);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(225, 6, 0, 0.3);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-10px);
            border-color: #e10600;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: bold;
            color: #e10600;
            margin: 10px 0;
        }

        .stat-label {
            color: #888;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .checkered-flag {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 3rem;
            animation: wave 2s ease-in-out infinite;
            opacity: 0.3;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-15deg); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .driver-card { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>
    <div class="checkered-flag">🏁</div>
    
    <div class="container">
        <header>
            <h1>F1 VIBES</h1>
            <p class="subtitle">2025 SEASON</p>
        </header>

        <div class="track">
            <div class="car">🏎️</div>
        </div>

        <div class="standings">
            <div class="driver-card" style="border-color: #e10600;">
                <div class="driver-info">
                    <div class="position">1</div>
                    <div>
                        <div class="driver-name">Max Verstappen</div>
                        <div class="team">Red Bull Racing</div>
                    </div>
                </div>
                <div class="points">575</div>
            </div>

            <div class="driver-card" style="border-color: #00d2be;">
                <div class="driver-info">
                    <div class="position">2</div>
                    <div>
                        <div class="driver-name">Lewis Hamilton</div>
                        <div class="team">Mercedes</div>
                    </div>
                </div>
                <div class="points">498</div>
            </div>

            <div class="driver-card" style="border-color: #dc0000;">
                <div class="driver-info">
                    <div class="position">3</div>
                    <div>
                        <div class="driver-name">Charles Leclerc</div>
                        <div class="team">Ferrari</div>
                    </div>
                </div>
                <div class="points">456</div>
            </div>

            <div class="driver-card" style="border-color: #ff8700;">
                <div class="driver-info">
                    <div class="position">4</div>
                    <div>
                        <div class="driver-name">Lando Norris</div>
                        <div class="team">McLaren</div>
                    </div>
                </div>
                <div class="points">412</div>
            </div>

            <div class="driver-card" style="border-color: #006f62;">
                <div class="driver-info">
                    <div class="position">5</div>
                    <div>
                        <div class="driver-name">Fernando Alonso</div>
                        <div class="team">Aston Martin</div>
                    </div>
                </div>
                <div class="points">387</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Top Speed</div>
                <div class="stat-value">372</div>
                <div class="stat-label">km/h</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Fastest Lap</div>
                <div class="stat-value">1:29.7</div>
                <div class="stat-label">Monaco GP</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Races</div>
                <div class="stat-value">24</div>
                <div class="stat-label">This Season</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Pole Positions</div>
                <div class="stat-value">15</div>
                <div class="stat-label">Verstappen</div>
            </div>
        </div>
    </div>

    <script>
        // Add some interactive sparkle
        document.querySelectorAll('.driver-card').forEach(card => {
            card.addEventListener('click', () => {
                card.style.transform = 'scale(1.05) translateX(10px)';
                setTimeout(() => {
                    card.style.transform = 'translateX(10px)';
                }, 200);
            });
        });

        // Random stat updates for vibe
        setInterval(() => {
            const statValues = document.querySelectorAll('.stat-value');
            statValues.forEach(stat => {
                stat.style.transform = 'scale(1.1)';
                stat.style.color = '#ff6b00';
                setTimeout(() => {
                    stat.style.transform = 'scale(1)';
                    stat.style.color = '#e10600';
                }, 300);
            });
        }, 5000);
    </script>
</body>
</html>
